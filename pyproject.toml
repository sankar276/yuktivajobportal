[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jobportal"
version = "0.1.0"
description = "Self-hosted job search: watch career pages, score roles, tailor the resume, apply, track."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "playwright>=1.49",
]

[project.optional-dependencies]
# Optional: Claude-assisted scoring notes, bullet rephrasing and email drafting.
# Everything works without it, using deterministic templates.
llm = ["anthropic>=0.40"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "aiosmtpd>=1.4",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
jobportal = "jobportal.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jobportal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "browser: needs a Chromium install (Playwright)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI/Typer use call-in-default by design
  "RUF012", # SQLAlchemy/pydantic class attributes
  "RUF001", # en/em dashes in patterns and sample text are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["jobportal"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
