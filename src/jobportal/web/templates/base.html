<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{% block title %}{% endblock %} - Yuktiva Job Portal</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
<header class="masthead">
  <a class="wordmark" href="/feed">Yuktiva Job Portal</a>
  <nav aria-label="Sections">
    <a href="/feed"{% if path.startswith("/feed") or path.startswith("/jobs") %} aria-current="page"{% endif %}>Feed</a>
    <a href="/queue"{% if path.startswith("/queue") %} aria-current="page"{% endif %}>Queue{% if nav.queue %}<span class="count" title="{{ nav.queue }} waiting on you">{{ nav.queue }}</span>{% endif %}</a>
    <a href="/tracker"{% if path.startswith("/tracker") or path.startswith("/applications") %} aria-current="page"{% endif %}>Tracker</a>
    <a href="/ledger"{% if path.startswith("/ledger") %} aria-current="page"{% endif %}>Ledger</a>
    <a href="/sources"{% if path.startswith("/sources") %} aria-current="page"{% endif %}>Sources</a>
    <a href="/answers"{% if path.startswith("/answers") %} aria-current="page"{% endif %}>Answers</a>
    <a href="/settings"{% if path.startswith("/settings") %} aria-current="page"{% endif %}>Settings</a>
  </nav>
  <div class="aside">
    <a href="/jobs/new">Add a role</a>
    {% if auth_enabled %}
    <form class="inline" method="post" action="/logout"><button class="quiet" type="submit">Sign out</button></form>
    {% endif %}
  </div>
</header>
<main>
  {% for item in flashes %}
  <p class="flash {{ item.kind }}" role="status">{{ item.message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
