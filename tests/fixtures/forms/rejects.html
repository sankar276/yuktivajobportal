<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply</title></head>
<body>
<div id="app">
  <label for="name">Full name</label><input id="name" type="text" name="name">
  <label for="email">Email</label><input id="email" type="email" name="email">
  <p class="error-message" id="err" style="display:none"></p>
  <button type="button" id="go">Submit application</button>
</div>
<script>
  document.getElementById("go").addEventListener("click", () => {
    const err = document.getElementById("err");
    err.textContent = "This position is no longer accepting applications.";
    err.style.display = "block";
  });
</script>
</body></html>
