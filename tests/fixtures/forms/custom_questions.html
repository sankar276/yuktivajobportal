<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Principal Platform Engineer at Acme Robotics</title>
<style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .field{margin:10px 0} label{display:block}</style>
</head>
<body>
<h1>Principal Platform Engineer</h1>
<p>Thank you for your interest in Acme Robotics. Apply below.</p>
<form id="application_form" action="/submit" method="post" enctype="multipart/form-data">
  <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label>
    <input type="text" id="first_name" name="job_application[first_name]" required></div>
  <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label>
    <input type="text" id="last_name" name="job_application[last_name]" required></div>
  <div class="field"><label for="email">Email <span class="asterisk">*</span></label>
    <input type="text" id="email" name="job_application[email]" required></div>
  <div class="field"><label for="phone">Phone</label>
    <input type="text" id="phone" name="job_application[phone]"></div>
  <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label>
    <button type="button">Attach</button>
    <input type="file" id="resume" name="job_application[resume]" class="visually-hidden" required></div>
  <div class="field"><label for="cover_letter">Cover Letter</label>
    <input type="file" id="cover_letter" name="job_application[cover_letter]" class="visually-hidden"></div>
  <div class="field"><label for="q1">LinkedIn Profile</label>
    <input type="text" id="q1" name="job_application[answers][0]"></div>
  <div class="field"><label for="q2">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label>
    <select id="q2" name="job_application[answers][1]" required>
      <option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q3">Will you now or in the future require sponsorship for employment visa status in the United States? <span class="asterisk">*</span></label>
    <select id="q3" name="job_application[answers][2]" required>
      <option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q4">What are your salary expectations?</label>
    <input type="text" id="q4" name="job_application[answers][3]"></div>
  <h3>Voluntary Self-Identification</h3>
  <div class="field"><label for="gender">Gender</label>
    <select id="gender" name="job_application[gender]">
      <option value="">Please select</option><option value="1">Male</option><option value="2">Female</option>
      <option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="race">Race</label>
    <select id="race" name="job_application[race]">
      <option value="">Please select</option><option value="1">Asian</option><option value="2">White</option>
      <option value="8">Decline To Self Identify</option></select></div>
  <div class="field"><label for="veteran">Veteran Status</label>
    <select id="veteran" name="job_application[veteran_status]">
      <option value="">Please select</option><option value="1">I am not a protected veteran</option>
      <option value="2">I identify as one or more of the classifications of a protected veteran</option>
      <option value="3">I don't wish to answer</option></select></div>
  <div class="field"><label for="disability">Disability Status</label>
    <select id="disability" name="job_application[disability_status]">
      <option value="">Please select</option><option value="1">Yes, I have a disability</option>
      <option value="2">No, I do not have a disability</option><option value="3">I do not want to answer</option></select></div>
  <div class="field"><label for="q9">Why do you want to work at Acme Robotics? <span class="asterisk">*</span></label><textarea id="q9" name="job_application[answers][9]" required></textarea></div><div class="field"><label><input type="checkbox" name="consent" value="1" required> I have read and agree to the candidate privacy policy *</label></div>
  <input type="text" name="website_url_confirm" style="display:none" tabindex="-1" autocomplete="off">
  <input type="submit" id="submit_app" value="Submit Application">
</form>
</body></html>
